plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.hotel.hello'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.hotel.hello'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Intentionally no dependencies: plain android.app.Activity needs nothing.
