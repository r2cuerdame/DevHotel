name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter devhotel prepare:github
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter devhotel-mcp build
      # CI verifies the tagged commit and proves the installer builds. It must
      # NOT publish: `--publish always` created a fresh draft release on every
      # run, and re-tagging left orphan drafts behind (10 had accumulated by
      # 0.4.3). The release itself is cut locally, where the ~110MB asset
      # upload is reliable — see docs/releasing.md.
      - name: Build the installer (no publish)
        run: pnpm --filter devhotel build && pnpm --filter devhotel exec electron-builder --win nsis --publish never
