name: Android Emulator Preview Image

# Builds the managed Android emulator preview image to prove it still builds.
# It is never pushed, and nothing pulls it.
#
# DevHotel builds this image inside its own managed Linux runtime, from the
# Dockerfile below, on the user's machine (see
# `packages/core/src/backend/managedEmulatorPreviewImage.ts`). That is what lets
# a clean Windows 11 machine with no GitHub credential reach a working emulator
# preview — the #111 Android claim — and it is why the earlier version of this
# workflow, which pushed to GHCR so the runtime could pull a digest, is gone.
#
# Building here matters more now rather than less. Because the build happens on
# every user's machine rather than once in CI, a package disappearing from the
# Ubuntu Jammy apt pool would break every fresh install rather than one release.
# This job is the guard that catches that while it is still a CI failure.

on:
  push:
    branches: [main]
    paths:
      - 'images/android-emulator-preview/Dockerfile'
      - '.github/workflows/android-emulator-preview-image.yml'
  pull_request:
    paths:
      - 'images/android-emulator-preview/Dockerfile'
      - '.github/workflows/android-emulator-preview-image.yml'
  workflow_dispatch:
  # The apt pool moves without this repository changing, so a build that passed
  # on merge can stop working later. Weekly is early enough to fix it before a
  # release carries it to users.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-22.04
    # No `packages: write`. Nothing is published, so nothing needs the token.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the preview image
        uses: docker/build-push-action@v6
        with:
          context: images/android-emulator-preview
          platforms: linux/amd64
          push: false
          load: true
          tags: devhotel/android-emulator-preview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the tools the managed entrypoint depends on are present
        # The entrypoint script generated by buildManagedEmulatorContainerArgs
        # calls each of these by name. A Dockerfile that builds but is missing
        # one of them fails much later, inside a Room, as a container that exits
        # immediately — so it is checked here instead.
        run: |
          docker run --rm --entrypoint sh devhotel/android-emulator-preview:ci -c '
            set -e
            for tool in Xvfb x11vnc openbox websockify python3 ffmpeg curl unzip java; do
              command -v "$tool" >/dev/null || { echo "missing: $tool" >&2; exit 1; }
            done
            test -d /usr/share/novnc || { echo "missing: novnc web root" >&2; exit 1; }
            test -d /opt/devhotel/android-sdk
            test -d /opt/devhotel/android-avd
            echo "all managed-entrypoint dependencies present"
          '
