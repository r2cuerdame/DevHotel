appId: io.devhotel.app
productName: DevHotel
directories:
  output: release
beforePack: scripts/verify-package-source.mjs
afterPack: scripts/write-packaged-build-identity.mjs
files:
  - out/**
  - package.json
extraResources:
  - from: ../../packages/mcp/dist/index.js
    to: mcp/index.js
  - from: resources/github/gh_2.97.0_windows_amd64.zip
    to: github/gh_2.97.0_windows_amd64.zip
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: r2cuerdame
  repo: DevHotel
